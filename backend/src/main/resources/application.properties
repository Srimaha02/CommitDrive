# =============================================================================
# CommitDrive Backend — Spring Boot Application Properties
# =============================================================================
spring.application.name=CommitDrive

# Server Port (8080)
server.port=8080

# Active Profile: Defaults to 'supabase' for Supabase PostgreSQL connection
spring.profiles.active=${SPRING_PROFILES_ACTIVE:supabase}

# JPA / Hibernate Configurations
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# Local In-Memory Profile (Default: works out of the box with zero setup)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:commitdrive_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS Configuration
commitdrive.cors.allowed-origins=http://localhost:5173,http://localhost:3000
