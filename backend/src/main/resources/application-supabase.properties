# =============================================================================
# CommitDrive Backend — Supabase PostgreSQL Configuration Profile
# Activate with: --spring.profiles.active=supabase
# Or set SPRING_PROFILES_ACTIVE=supabase
# =============================================================================

# Supabase Connection Pooler / Direct Database URL
# Format: jdbc:postgresql://db.<PROJECT-REF>.supabase.co:5432/postgres?sslmode=require
# Or Pooler: jdbc:postgresql://aws-0-<REGION>.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.gkzeusndvjrzxkqcmcmv}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# PostgreSQL Dialect & DDL Strategy
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Connection Pool Optimized for Supabase Serverless & Transaction Pooler
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000
